name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Scryfall's bulk file is ~78 MB; caching it keeps repeat builds off their CDN.
      - uses: actions/cache@v6
        with:
          path: .cache
          key: scryfall-bulk-${{ github.run_id }}
          restore-keys: scryfall-bulk-
      - run: pnpm test
      - run: pnpm check
      - run: pnpm build:data
      # Gates the deploy on the data itself, not just the code that fetched it.
      - run: pnpm verify:data
      - run: pnpm build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
