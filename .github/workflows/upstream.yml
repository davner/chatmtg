name: Upstream contract

# The pipeline is built on assumptions about Scryfall, MTGJSON, and the Wizards
# announcement pages. When one of those changes shape, the build keeps
# succeeding and starts producing wrong data, so these run on their own:
# on demand, and weekly so drift surfaces without anyone remembering to look.
on:
  workflow_dispatch:
  schedule:
    # Mondays, 08:00 UTC.
    - cron: '0 8 * * 1'

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-contract
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the upstream contracts
        run: pnpm test:upstream

  # A weekly check nobody reads is a check nobody runs. A scheduled failure
  # opens an issue; a manual run just reports in the log.
  report:
    needs: contract
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = 'Upstream contract check failed'
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const body = [
              'The weekly upstream contract check failed, which usually means',
              'Scryfall, MTGJSON, or a Wizards announcement page changed shape.',
              '',
              'The build does not fail on its own when this happens — it keeps',
              'succeeding and produces wrong data — so this is worth reading.',
              '',
              `Run: ${url}`,
            ].join('\n')

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'upstream',
            })
            const open = existing.data.find((i) => i.title === title)
            if (open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open.number,
                body: `Failed again. ${url}`,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['upstream'],
              })
            }
